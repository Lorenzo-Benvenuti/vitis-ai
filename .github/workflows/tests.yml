name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # The default PyTorch wheels on PyPI bundle the CUDA runtime (several GB)
      # and regularly exhaust the disk on hosted runners. The CPU-only index
      # ships the same versions without it. Keep these pins in sync with
      # requirements.txt — the "+cpu" local versions satisfy the "==" pins there,
      # so the next step will not reinstall them.
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.12.0" "torchvision==0.27.0"

      - name: Install project dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the test suite
        run: pytest -q
